<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FILKOM BORROW - Portal Peminjaman Mahasiswa</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React-DOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel CDN for In-Browser JSX Compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- html5-qrcode CDN for Webcam Scanning -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .shape-rendering-crispedges {
      shape-rendering: crispedges;
    }
    @keyframes scanAnimation {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }
    .animate-scan-line {
      animation: scanAnimation 3s infinite linear;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // DUMMY STUDENTS WITH EXTENDED PROFILES
    // ==========================================
    const DUMMY_STUDENTS = [
      { 
        nim: '245150300111002', 
        name: 'Jahzeel', 
        dob: '12 April 2006', 
        major: 'Teknik Informatika', 
        faculty: 'Ilmu Komputer', 
        photo: '👨‍💻' 
      },
      { 
        nim: '245150300111008', 
        name: 'Abdillah', 
        dob: '25 September 2005', 
        major: 'Sistem Informasi', 
        faculty: 'Ilmu Komputer', 
        photo: '🚀' 
      }
    ];

    const INITIAL_FACILITIES = [
      { id: 'f1', name: 'GKM Lt.2', type: 'Ruangan', status: 'tersedia' },
      { id: 'f2', name: 'Lab Komputer', type: 'Ruangan', status: 'tersedia' },
      { id: 'f3', name: 'Ruang Rapat', type: 'Ruangan', status: 'tersedia' },
      { id: 'f4', name: 'PS5 Station A', type: 'Game Corner', status: 'digunakan' },
      { id: 'f5', name: 'PS5 Station B', type: 'Game Corner', status: 'tersedia' },
      { id: 'f6', name: 'PC Gaming 1', type: 'Game Corner', status: 'tersedia' }
    ];

    const INITIAL_BOOKINGS = [
      {
        id: 'b1',
        facilityId: 'f1',
        facilityName: 'GKM Lt.2',
        facilityType: 'Ruangan',
        studentNim: '245150300111002',
        studentName: 'Jahzeel',
        startTime: '2026-06-05T09:00',
        endTime: '2026-06-05T12:00',
        status: 'Menunggu',
        token: 'QR-RM-GKM2',
        reason: ''
      },
      {
        id: 'b2',
        facilityId: 'f4',
        facilityName: 'PS5 Station A',
        facilityType: 'Game Corner',
        studentNim: '245150300111008',
        studentName: 'Abdillah',
        startTime: '2026-06-05T16:00',
        endTime: '2026-06-05T17:00',
        status: 'Aktif',
        token: 'QR-GC-8B92',
        reason: ''
      }
    ];

    // Helper to generate dynamic simulated QR code grid
    function QRCodeSimulated({ token, size = 100 }) {
      const gridSize = 9;
      const cells = [];
      let hash = 0;
      for (let i = 0; i < token.length; i++) {
        hash = token.charCodeAt(i) + ((hash << 5) - hash);
      }
      
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const isTopLeftCorner = r < 3 && c < 3;
          const isTopRightCorner = r < 3 && c >= gridSize - 3;
          const isBottomLeftCorner = r >= gridSize - 3 && c < 3;
          
          let filled = false;
          if (isTopLeftCorner) {
            filled = (r === 0 || r === 2 || c === 0 || c === 2);
          } else if (isTopRightCorner) {
            filled = (r === 0 || r === 2 || c === gridSize - 1 || c === gridSize - 3);
          } else if (isBottomLeftCorner) {
            filled = (r === gridSize - 1 || r === gridSize - 3 || c === 0 || c === 2);
          } else {
            const val = Math.abs(hash ^ (r * 13 + c * 37));
            filled = (val % 3) === 0;
          }
          cells.push({ r, c, filled });
        }
      }

      return (
        <div 
          className="flex flex-col items-center justify-center bg-white rounded-lg p-1.5 border border-slate-200 shadow shadow-inner"
          style={{ width: `${size}px`, height: `${size}px` }}
        >
          <svg width={size - 10} height={size - 10} viewBox="0 0 9 9" className="shape-rendering-crispedges">
            {cells.map((cell, idx) => (
              <rect
                key={idx}
                x={cell.c}
                y={cell.r}
                width="1"
                height="1"
                fill={cell.filled ? "#1E293B" : "#FFFFFF"}
              />
            ))}
          </svg>
        </div>
      );
    }

    // KTM Dummy ID Card component
    function KTMCard({ student, onSimulateScan }) {
      return (
        <div 
          onClick={() => onSimulateScan(`KTM-${student.nim}`)}
          className="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl relative overflow-hidden w-full max-w-sm cursor-pointer transform hover:-translate-y-1 hover:border-amber-500/40 transition-all duration-200 select-none group"
        >
          <div className="absolute top-0 left-0 w-full h-1 bg-amber-500"></div>
          
          <div className="flex justify-between items-center border-b border-slate-800/80 pb-2 mb-3">
            <div className="flex items-center space-x-1.5">
              <div className="bg-amber-500 text-slate-950 p-1 rounded font-extrabold text-[8px] leading-none">UB</div>
              <span className="text-[9px] font-extrabold tracking-wider text-slate-300">UNIVERSITAS BRAWIJAYA</span>
            </div>
            <span className="text-[8px] font-bold text-slate-400 bg-slate-950 border border-slate-850 px-2 py-0.5 rounded">KTM DIGITAL</span>
          </div>

          <div className="flex justify-between items-stretch">
            <div className="flex space-x-3 items-center flex-1">
              <div className="w-14 h-16 bg-slate-950 rounded-lg flex items-center justify-center text-3xl border border-slate-850 shadow-inner">
                {student.photo}
              </div>
              <div className="space-y-1 text-left">
                <div className="text-[8px] text-slate-500 uppercase tracking-wider font-bold">NAMA</div>
                <div className="text-xs font-extrabold text-white truncate max-w-[130px]">{student.name}</div>
                
                <div className="text-[8px] text-slate-500 uppercase tracking-wider font-bold mt-1.5">NIM / JURUSAN</div>
                <div className="text-[10px] font-bold text-amber-400 font-mono leading-none">{student.nim}</div>
                <div className="text-[9px] font-medium text-slate-300 truncate max-w-[135px]">{student.major}</div>
              </div>
            </div>

            <div className="flex flex-col justify-center items-center bg-white p-1 rounded-lg self-center shadow">
              <QRCodeSimulated token={`KTM-${student.nim}`} size={60} />
              <span className="text-[6px] text-slate-500 font-mono mt-1 font-extrabold tracking-wider">TAP UNTUK SCAN</span>
            </div>
          </div>

          <div className="absolute inset-0 bg-slate-950/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center rounded-2xl">
            <div className="bg-amber-500 text-slate-950 font-extrabold text-[9px] py-1 px-3 rounded-full shadow-lg tracking-wide uppercase">
              Simulasikan Scan KTM
            </div>
          </div>
        </div>
      );
    }

    function App() {
      // ==========================================
      // STATE VARIABLES
      // ==========================================
      const [currentStudent, setCurrentStudent] = useState(null); // NULL = Unauthenticated (Need KTM scan)
      const [bookings, setBookings] = useState([]);
      const [facilities, setFacilities] = useState(INITIAL_FACILITIES);
      const [notifications, setNotifications] = useState([]);

      // Scanner states
      const [studentScanner, setStudentScanner] = useState(null);
      const [scannerActive, setScannerActive] = useState(false);
      const [scanFeedback, setScanFeedback] = useState({ text: '', type: '' });

      // Booking Form inputs
      const [selectedFacilityId, setSelectedFacilityId] = useState('');
      const [bookingDuration, setBookingDuration] = useState('1'); // Default: 1 jam
      const [bookingError, setBookingError] = useState('');
      const [bookingSuccess, setBookingSuccess] = useState('');

      const bookingsRef = useRef(bookings);
      
      // Load bookings & setup localStorage
      useEffect(() => {
        const storedBookings = localStorage.getItem('filkom_bookings');
        if (storedBookings) {
          const parsed = JSON.parse(storedBookings);
          setBookings(parsed);
          bookingsRef.current = parsed;
        } else {
          localStorage.setItem('filkom_bookings', JSON.stringify(INITIAL_BOOKINGS));
          setBookings(INITIAL_BOOKINGS);
          bookingsRef.current = INITIAL_BOOKINGS;
        }

        const storedNotifs = localStorage.getItem('filkom_notifications');
        if (storedNotifs) {
          setNotifications(JSON.parse(storedNotifs));
        } else {
          const initNotifs = [
            { id: 'n1', studentNim: '245150300111002', message: 'Selamat datang di portal scan FILKOM Borrow.', read: false, time: 'Baru saja' }
          ];
          localStorage.setItem('filkom_notifications', JSON.stringify(initNotifs));
          setNotifications(initNotifs);
        }
      }, []);

      // Keep ref updated and calculate facility states dynamically
      useEffect(() => {
        bookingsRef.current = bookings;
        setFacilities(prev => {
          return prev.map(fac => {
            const isActive = bookings.some(b => b.facilityId === fac.id && b.status === 'Aktif');
            return {
              ...fac,
              status: isActive ? 'digunakan' : 'tersedia'
            };
          });
        });
      }, [bookings]);

      // Storage sync interval (checks every 1 second)
      useEffect(() => {
        const syncInterval = setInterval(() => {
          const data = localStorage.getItem('filkom_bookings');
          if (data) {
            const parsed = JSON.parse(data);
            if (JSON.stringify(parsed) !== JSON.stringify(bookingsRef.current)) {
              setBookings(parsed);
            }
          }

          const notifData = localStorage.getItem('filkom_notifications');
          if (notifData) {
            setNotifications(JSON.parse(notifData));
          }
        }, 1000);

        return () => clearInterval(syncInterval);
      }, []);

      // Automatically open scanner on mount (if student is not logged in)
      useEffect(() => {
        if (!currentStudent) {
          startScanner();
        } else {
          stopScanner();
        }
        return () => {
          if (studentScanner) studentScanner.stop().catch(e => {});
        };
      }, [currentStudent]);

      // ==========================================
      // ACTION HANDLERS
      // ==========================================
      const startScanner = () => {
        if (studentScanner) studentScanner.stop().catch(e => {});
        setScannerActive(true);
        setScanFeedback({ text: '', type: '' });

        setTimeout(() => {
          try {
            const scanner = new Html5Qrcode("student-webcam-container");
            scanner.start(
              { facingMode: "environment" },
              {
                fps: 10,
                qrbox: { width: 220, height: 220 }
              },
              (decodedText) => {
                handleScannedCode(decodedText);
              },
              (error) => {}
            ).then(() => {
              setStudentScanner(scanner);
            }).catch(err => {
              console.warn("Camera access failed. Simulation dropdown is ready.", err);
            });
          } catch (e) {
            console.error(e);
          }
        }, 150);
      };

      const stopScanner = () => {
        if (studentScanner) {
          studentScanner.stop().then(() => {
            setStudentScanner(null);
            setScannerActive(false);
          }).catch(err => {
            console.error(err);
            setStudentScanner(null);
            setScannerActive(false);
          });
        } else {
          setScannerActive(false);
        }
      };

      // Handle decoding KTM-NIM to log in
      const handleScannedCode = (text) => {
        if (!text) return;
        setScanFeedback({ text: '', type: '' });

        const query = text.trim();
        if (query.startsWith('KTM-')) {
          const nim = query.substring(4);
          const student = DUMMY_STUDENTS.find(s => s.nim === nim);
          if (student) {
            setCurrentStudent(student);
            setBookingError('');
            setBookingSuccess('');
            setScanFeedback({ text: `KTM ${student.name} berhasil terverifikasi!`, type: 'success' });
            stopScanner();
          } else {
            setScanFeedback({ text: `NIM KTM tidak dikenal dalam database.`, type: 'error' });
          }
        } else {
          setScanFeedback({ text: `Format QR Code tidak valid. Harap scan QR Code pada KTM.`, type: 'error' });
        }
      };

      // Submit booking
      const handleCreateBooking = (e) => {
        e.preventDefault();
        setBookingError('');
        setBookingSuccess('');

        if (!selectedFacilityId || !bookingDuration) {
          setBookingError('Harap lengkapi semua kolom peminjaman.');
          return;
        }

        const fac = facilities.find(f => f.id === selectedFacilityId);
        if (!fac) return;

        if (fac.status === 'digunakan') {
          setBookingError(`Fasilitas ${fac.name} sedang digunakan.`);
          return;
        }

        const now = new Date();
        const end = new Date(now.getTime() + parseFloat(bookingDuration) * 60 * 60 * 1000);
        
        const formatDate = (d) => {
          const pad = (n) => String(n).padStart(2, '0');
          return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };

        const tokenCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        const typePrefix = fac.type === 'Ruangan' ? 'RM' : 'GC';
        const generatedToken = `QR-${typePrefix}-${tokenCode}`;

        const isRoom = fac.type === 'Ruangan';
        const bookingStatus = isRoom ? 'Menunggu' : 'Aktif';

        const newBooking = {
          id: `b-${Date.now()}`,
          facilityId: fac.id,
          facilityName: fac.name,
          facilityType: fac.type,
          studentNim: currentStudent.nim,
          studentName: currentStudent.name,
          startTime: formatDate(now),
          endTime: formatDate(end),
          status: bookingStatus,
          token: generatedToken,
          reason: ''
        };

        // Save to localStorage
        const latestBookings = [newBooking, ...bookingsRef.current];
        localStorage.setItem('filkom_bookings', JSON.stringify(latestBookings));
        setBookings(latestBookings);

        // Notify student
        const storedNotifs = JSON.parse(localStorage.getItem('filkom_notifications') || '[]');
        const newNotif = {
          id: `n-${Date.now()}`,
          studentNim: currentStudent.nim,
          message: isRoom 
            ? `Peminjaman ruang ${fac.name} diajukan! Menunggu persetujuan Staf Gedung A.`
            : `Peminjaman Game Corner ${fac.name} berhasil aktif! Scan QR token ${generatedToken} di Lobby.`,
          read: false,
          time: 'Baru saja'
        };
        const updatedNotifs = [newNotif, ...storedNotifs];
        localStorage.setItem('filkom_notifications', JSON.stringify(updatedNotifs));
        setNotifications(updatedNotifs);

        setBookingSuccess(isRoom 
          ? `Permohonan ruangan ${fac.name} berhasil dikirim ke Staf Gedung!` 
          : `Peminjaman Game Corner ${fac.name} berhasil diaktifkan!`
        );

        setSelectedFacilityId('');
      };

      const handleLogout = () => {
        setCurrentStudent(null);
        setBookingError('');
        setBookingSuccess('');
        setScanFeedback({ text: '', type: '' });
      };

      // Filters
      const myActiveBooking = bookings.find(b => b.studentNim === (currentStudent ? currentStudent.nim : '') && b.status === 'Aktif');
      const myPendingBooking = bookings.find(b => b.studentNim === (currentStudent ? currentStudent.nim : '') && b.status === 'Menunggu');
      const myBookingsList = currentStudent ? bookings.filter(b => b.studentNim === currentStudent.nim) : [];

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans select-none antialiased pb-12">
          
          {/* Header */}
          <header className="sticky top-0 z-40 bg-slate-900 border-b border-amber-500/30 text-white shadow-lg backdrop-blur-md bg-opacity-95">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-amber-500 text-slate-950 p-2 rounded-lg font-bold text-xs tracking-wider flex flex-col justify-center items-center h-10 w-10 shadow-md">
                  <span className="leading-none text-[10px]">UB</span>
                  <span className="font-extrabold text-[12px] leading-none">FKM</span>
                </div>
                <div>
                  <h1 className="font-extrabold text-sm sm:text-base tracking-wide text-amber-400">FILKOM BORROW</h1>
                  <p className="text-[10px] text-slate-400">Peminjaman Fasilitas Mahasiswa</p>
                </div>
              </div>

              {/* Redirect to admin portal link */}
              <div className="flex items-center space-x-4">
                <a 
                  href="./admin.html" 
                  target="_blank"
                  className="bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-bold transition flex items-center space-x-1"
                >
                  <span>Buka Portal Admin</span>
                  <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                  </svg>
                </a>
              </div>
            </div>
          </header>

          {/* Main Container */}
          <main className="max-w-4xl w-full mx-auto px-4 py-6 space-y-6">
            
            {!currentStudent ? (
              // ==========================================
              // STEP 1: AUTHENTICATION FLOW (SCAN KTM)
              // ==========================================
              <div className="space-y-6">
                
                {/* Banner Info */}
                <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 rounded-2xl p-5 border border-slate-800 shadow-xl text-center max-w-xl mx-auto">
                  <h2 className="text-base font-bold text-white">Verifikasi KTM Untuk Pinjam Fasilitas</h2>
                  <p className="text-xs text-slate-450 mt-1.5">
                    Silakan scan QR Code Kartu Tanda Mahasiswa (KTM) Anda ke kamera. Jika tidak memiliki webcam, gunakan dummy KTM di bawah untuk masuk.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl mx-auto">
                  
                  {/* Left Column: Live camera viewport */}
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                    <div className="flex justify-between items-center border-b border-slate-850 pb-2">
                      <span className="text-xs font-bold text-slate-350 uppercase tracking-wider flex items-center space-x-1.5">
                        <span className="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-ping"></span>
                        <span>Scanner KTM Aktif</span>
                      </span>
                    </div>

                    {scanFeedback.text && (
                      <div className={`p-2.5 rounded-xl text-xs text-center border ${
                        scanFeedback.type === 'success' 
                          ? 'bg-emerald-950/70 border-emerald-900/40 text-emerald-300' 
                          : 'bg-rose-950/70 border-rose-900/40 text-rose-300'
                      }`}>
                        {scanFeedback.text}
                      </div>
                    )}

                    <div className="relative rounded-2xl border border-slate-800 overflow-hidden bg-slate-950 aspect-video flex flex-col justify-center items-center">
                      <div id="student-webcam-container" className="absolute inset-0 w-full h-full object-cover"></div>
                      
                      {scannerActive && <div className="absolute inset-x-0 h-[2.5px] bg-emerald-500 shadow-[0_0_10px_3px_#10B981] animate-scan-line z-20"></div>}

                      {!scannerActive && (
                        <div className="text-center p-4 z-10 space-y-2 text-slate-600">
                          <span>📷</span>
                          <p className="text-[10px]">Kamera dinonaktifkan</p>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Right Column: Dummy KTM Cards */}
                  <div className="space-y-4 flex flex-col justify-center">
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider pl-1">Dummy KTM Card (Klik untuk Demo Scan):</h3>
                    
                    <div className="space-y-3.5">
                      {DUMMY_STUDENTS.map(student => (
                        <KTMCard 
                          key={student.nim} 
                          student={student} 
                          onSimulateScan={handleScannedCode} 
                        />
                      ))}
                    </div>
                  </div>

                </div>
              </div>
            ) : (
              // ==========================================
              // STEP 2: BOOKING FLOW (AFTER SCAN KTM)
              // ==========================================
              <div className="space-y-6 animate-in fade-in duration-300">
                
                {/* Upper Section: Student Card Profile & Form */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  
                  {/* Student KTM Profile Card Display */}
                  <div className="md:col-span-1 flex flex-col justify-start space-y-4">
                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider pl-1">Akun KTM Terverifikasi</span>
                    
                    <div className="bg-gradient-to-br from-indigo-950 via-slate-900 to-indigo-950 border border-amber-500/30 rounded-2xl p-5 shadow-2xl relative overflow-hidden">
                      <div className="absolute top-0 left-0 w-full h-1 bg-amber-500"></div>
                      
                      <div className="flex justify-between items-center border-b border-slate-800 pb-2.5 mb-4">
                        <span className="text-[9px] font-extrabold text-slate-300">MAHASISWA FILKOM UB</span>
                        <button 
                          onClick={handleLogout}
                          className="text-[8px] font-bold text-rose-400 bg-rose-950/40 hover:bg-rose-900/60 border border-rose-900/30 px-2 py-0.5 rounded transition"
                        >
                          Keluar
                        </button>
                      </div>

                      <div className="flex flex-col items-center space-y-3">
                        <div className="w-16 h-20 bg-slate-950 rounded-lg flex items-center justify-center text-4xl border border-slate-850 shadow-inner">
                          {currentStudent.photo}
                        </div>
                        
                        <div className="text-center space-y-1 w-full">
                          <h4 className="font-extrabold text-slate-100 text-sm leading-tight">{currentStudent.name}</h4>
                          <p className="text-[10px] font-extrabold text-amber-400 font-mono tracking-wider">{currentStudent.nim}</p>
                          <p className="text-[10px] text-slate-400">{currentStudent.major}</p>
                          <p className="text-[9px] text-slate-500 font-semibold">{currentStudent.dob} • {currentStudent.faculty}</p>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Booking Form Card */}
                  <div className="md:col-span-2 space-y-4">
                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider pl-1">Form Ajukan Sewa</span>
                    
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-4">
                      
                      {bookingError && (
                        <div className="p-3 rounded-lg bg-rose-950/60 border border-rose-900/40 text-rose-300 text-xs flex items-center space-x-2">
                          <svg className="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                          </svg>
                          <span>{bookingError}</span>
                        </div>
                      )}

                      {bookingSuccess && (
                        <div className="p-3 rounded-lg bg-emerald-950/60 border border-emerald-900/40 text-emerald-300 text-xs flex items-center space-x-2">
                          <svg className="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                          </svg>
                          <span>{bookingSuccess}</span>
                        </div>
                      )}

                      <form onSubmit={handleCreateBooking} className="space-y-4">
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider">Pilih Unit Fasilitas:</label>
                            <select
                              value={selectedFacilityId}
                              onChange={(e) => {
                                setSelectedFacilityId(e.target.value);
                                setBookingError('');
                                setBookingSuccess('');
                              }}
                              className="w-full mt-1.5 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                            >
                              <option value="">-- Pilih Fasilitas --</option>
                              {facilities.map(f => (
                                <option key={f.id} value={f.id} disabled={f.status === 'digunakan'}>
                                  [{f.type}] {f.name} - {f.status === 'digunakan' ? 'Penuh' : 'Tersedia'}
                                </option>
                              ))}
                            </select>
                          </div>

                          <div>
                            <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider">Durasi Sewa:</label>
                            <select
                              value={bookingDuration}
                              onChange={(e) => setBookingDuration(e.target.value)}
                              className="w-full mt-1.5 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                            >
                              <option value="0.5">30 Menit</option>
                              <option value="1">1 Jam</option>
                              <option value="2">2 Jam</option>
                              <option value="3">3 Jam</option>
                            </select>
                          </div>
                        </div>

                        <div className="text-[10px] text-slate-500 bg-slate-950/50 p-2.5 rounded-lg border border-slate-850">
                          💡 **Keterangan**: Peminjaman unit **Game Corner** (PS5/PC) akan aktif secara otomatis. Peminjaman unit **Ruangan** (GKM/Lab/Meeting) membutuhkan approval manual oleh Staf Gedung A di tab Admin.
                        </div>

                        <div className="flex justify-end pt-2">
                          <button
                            type="submit"
                            className="px-6 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold rounded-lg shadow shadow-amber-500/10 transition"
                          >
                            Ajukan Peminjaman
                          </button>
                        </div>
                      </form>
                    </div>
                  </div>

                </div>

                {/* Middle Section: Active tickets display */}
                {(myActiveBooking || myPendingBooking) && (
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                    <h3 className="text-sm font-bold text-slate-200 uppercase tracking-wider">Tiket Aktif Saat Ini</h3>
                    
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {myActiveBooking && (
                        <div className="bg-slate-950 border border-emerald-500/20 rounded-xl p-4 flex items-center justify-between relative overflow-hidden">
                          <div className="absolute top-0 right-0 bg-emerald-500 text-slate-950 text-[8px] font-extrabold px-2.5 py-0.5 rounded-bl uppercase tracking-wider">
                            Sewa Aktif
                          </div>
                          <div className="space-y-1">
                            <span className="text-[8px] font-bold text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-900/40 uppercase tracking-wider">
                              {myActiveBooking.facilityType}
                            </span>
                            <h4 className="font-extrabold text-slate-200 text-sm mt-1">{myActiveBooking.facilityName}</h4>
                            <p className="text-[10px] text-slate-500 font-mono">Token: {myActiveBooking.token}</p>
                            <p className="text-[10px] text-slate-450">Selesai: {new Date(myActiveBooking.endTime).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</p>
                          </div>
                          <div className="scale-90 flex-shrink-0">
                            <QRCodeSimulated token={myActiveBooking.token} size={70} />
                          </div>
                        </div>
                      )}

                      {myPendingBooking && (
                        <div className="bg-slate-950 border border-amber-500/20 rounded-xl p-4 flex items-center justify-between relative overflow-hidden">
                          <div className="absolute top-0 right-0 bg-amber-500 text-slate-950 text-[8px] font-extrabold px-2.5 py-0.5 rounded-bl uppercase tracking-wider">
                            Menunggu Review
                          </div>
                          <div className="space-y-1">
                            <span className="text-[8px] font-bold text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-900/40 uppercase tracking-wider">
                              {myPendingBooking.facilityType}
                            </span>
                            <h4 className="font-extrabold text-slate-200 text-sm mt-1">{myPendingBooking.facilityName}</h4>
                            <p className="text-[10px] text-slate-500 leading-normal max-w-[170px]">Menunggu persetujuan Staf Gedung A untuk mengaktifkan ruangan.</p>
                          </div>
                          <div className="h-16 w-16 bg-slate-900 rounded-lg flex flex-col justify-center items-center border border-slate-800 text-[10px] text-slate-500 font-bold px-1 select-none flex-shrink-0">
                            <span>⏳</span>
                            <span>Pending</span>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* Lower Section: Student transaction history */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                  <h3 className="text-sm font-bold text-slate-200 uppercase tracking-wider">Riwayat Peminjaman Fasilitas ({currentStudent.name})</h3>
                  
                  <div className="overflow-x-auto rounded-xl border border-slate-800/80">
                    <table className="min-w-full divide-y divide-slate-800">
                      <thead className="bg-slate-950">
                        <tr>
                          <th className="px-4 py-3 text-left text-[10px] font-bold text-slate-500 uppercase tracking-wider">Fasilitas</th>
                          <th className="px-4 py-3 text-left text-[10px] font-bold text-slate-500 uppercase tracking-wider">Tipe</th>
                          <th className="px-4 py-3 text-left text-[10px] font-bold text-slate-500 uppercase tracking-wider">Waktu Sewa</th>
                          <th className="px-4 py-3 text-left text-[10px] font-bold text-slate-500 uppercase tracking-wider">Status</th>
                          <th className="px-4 py-3 text-left text-[10px] font-bold text-slate-500 uppercase tracking-wider">Token / Info</th>
                        </tr>
                      </thead>
                      <tbody className="bg-slate-900/20 divide-y divide-slate-800">
                        {myBookingsList.length === 0 ? (
                          <tr>
                            <td colSpan="5" className="px-4 py-6 text-center text-xs text-slate-500 italic">
                              Belum ada catatan sewa. Gunakan form di atas untuk meminjam fasilitas.
                            </td>
                          </tr>
                        ) : (
                          myBookingsList.map(b => {
                            let statusBadge = '';
                            switch (b.status) {
                              case 'Aktif': statusBadge = 'bg-emerald-950 text-emerald-300 border border-emerald-900/50'; break;
                              case 'Menunggu': statusBadge = 'bg-amber-950 text-amber-300 border border-amber-900/50'; break;
                              case 'Ditolak': statusBadge = 'bg-rose-950 text-rose-300 border border-rose-900/50'; break;
                              case 'Selesai': default: statusBadge = 'bg-slate-850 text-slate-450 border border-slate-800'; break;
                            }

                            const formatTimeRange = (startStr, endStr) => {
                              const s = new Date(startStr);
                              const e = new Date(endStr);
                              return isNaN(s.getTime()) 
                                ? `${startStr} - ${endStr}`
                                : `${s.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' })} ${s.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })} s/d ${e.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}`;
                            };

                            return (
                              <tr key={b.id} className="hover:bg-slate-900/30 transition">
                                <td className="px-4 py-3 text-xs font-bold text-slate-200">{b.facilityName}</td>
                                <td className="px-4 py-3 text-xs text-slate-450">{b.facilityType}</td>
                                <td className="px-4 py-3 text-xs text-slate-400">{formatTimeRange(b.startTime, b.endTime)}</td>
                                <td className="px-4 py-3 text-xs">
                                  <span className={`inline-flex px-2.5 py-0.5 rounded-full text-[9px] font-bold ${statusBadge}`}>
                                    {b.status}
                                  </span>
                                </td>
                                <td className="px-4 py-3 text-xs font-mono">
                                  {b.status === 'Aktif' ? (
                                    <span className="text-amber-500 font-bold bg-amber-950/20 px-2 py-0.5 rounded border border-amber-500/20">{b.token}</span>
                                  ) : b.status === 'Ditolak' ? (
                                    <span className="text-rose-400 italic text-[11px]">Ditolak: {b.reason || '-'}</span>
                                  ) : b.status === 'Menunggu' ? (
                                    <span className="text-slate-500 italic text-[11px]">Butuh Approval Staf</span>
                                  ) : (
                                    <span className="text-slate-500">Selesai sewa</span>
                                  )}
                                </td>
                              </tr>
                            );
                          })
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="mt-auto text-center text-xs text-slate-700 pt-6">
            <p>© 2026 Fakultas Ilmu Komputer, Universitas Brawijaya. In-Memory LocalStorage Prototype.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
