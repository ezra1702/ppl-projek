    // Helper to generate dynamic simulated QR code grid
    function QRCodeSimulated({ token, size = 100 }) {
      const gridSize = 9;
      const cells = [];
      let hash = 0;
      for (let i = 0; i < token.length; i++) {
        hash = token.charCodeAt(i) + ((hash << 5) - hash);
      }
      
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const isTopLeftCorner = r < 3 && c < 3;
          const isTopRightCorner = r < 3 && c >= gridSize - 3;
          const isBottomLeftCorner = r >= gridSize - 3 && c < 3;
          
          let filled = false;
          if (isTopLeftCorner) {
            filled = (r === 0 || r === 2 || c === 0 || c === 2);
          } else if (isTopRightCorner) {
            filled = (r === 0 || r === 2 || c === gridSize - 1 || c === gridSize - 3);
          } else if (isBottomLeftCorner) {
            filled = (r === gridSize - 1 || r === gridSize - 3 || c === 0 || c === 2);
          } else {
            const val = Math.abs(hash ^ (r * 13 + c * 37));
            filled = (val % 3) === 0;
          }
          cells.push({ r, c, filled });
        }
      }

      return (
        <div 
          className="flex flex-col items-center justify-center bg-white rounded-lg p-1.5 border border-slate-200 shadow shadow-inner"
          style={{ width: `${size}px`, height: `${size}px` }}
        >
          <svg width={size - 10} height={size - 10} viewBox="0 0 9 9" className="shape-rendering-crispedges">
            {cells.map((cell, idx) => (
              <rect
                key={idx}
                x={cell.c}
                y={cell.r}
                width="1"
                height="1"
                fill={cell.filled ? "#1E293B" : "#FFFFFF"}
              />
            ))}
          </svg>
        </div>
      );
    }

    // KTM Dummy ID Card component
    function KTMCard({ student, onSimulateScan }) {

          <div className="flex justify-between items-center border-b border-slate-800/80 pb-2 mb-3">

              <span className="text-[9px] font-extrabold tracking-wider text-slate-300">UNIVERSITAS BRAWIJAYA</span>
            </div>
            <span className="text-[8px] font-bold text-slate-400 bg-slate-950 border border-slate-850 px-2 py-0.5 rounded">KTM DIGITAL</span>
          </div>

          <div className="flex justify-between items-stretch">

              <div className="w-14 h-16 bg-slate-950 rounded-lg flex items-center justify-center text-3xl border border-slate-850 shadow-inner overflow-hidden">
                {student.photo.includes('/') || student.photo.includes('.') ? (

                ) : (
                  student.photo

              <div className="space-y-1 text-left">

                <div className="text-[8px] text-slate-500 uppercase tracking-wider font-bold mt-1.5">NIM / JURUSAN</div>

                <div className="text-[9px] font-medium text-slate-300 truncate max-w-[135px]">{student.major} (Angkatan {student.angkatan})</div>
              </div>

            <div className="flex flex-col justify-center items-center bg-white p-1 rounded-lg self-center shadow">
              <QRCodeSimulated token={`KTM-${student.nim}`} size={60} />

            <div className="bg-blue-600 text-slate-950 font-extrabold text-[9px] py-1 px-3 rounded-full shadow-lg tracking-wide uppercase">

    }

    function App() {
      // ==========================================
      // STATE VARIABLES
      // ==========================================
      const [currentStudent, setCurrentStudent] = useState(null); // NULL = Unauthenticated (Need KTM scan)
      const [bookings, setBookings] = useState([]);
      const [facilities, setFacilities] = useState(INITIAL_FACILITIES);
      const [notifications, setNotifications] = useState([]);

      // Scanner states
      const [studentScanner, setStudentScanner] = useState(null);
      const studentScannerRef = useRef(null);
      const studentScannerStateRef = useRef('stopped'); // 'stopped' | 'starting' | 'running'
      const [scannerActive, setScannerActive] = useState(false);
      const [scanFeedback, setScanFeedback] = useState({ text: '', type: '' });
      const [showManualInput, setShowManualInput] = useState(false);
      const [manualNim, setManualNim] = useState('');

      // Booking Form inputs
      const [selectedFacilityId, setSelectedFacilityId] = useState('');
      const [bookingDuration, setBookingDuration] = useState('1'); // Default: 1 jam
      const [bookingPurpose, setBookingPurpose] = useState('');
      const [bookingError, setBookingError] = useState('');
      const [bookingSuccess, setBookingSuccess] = useState('');

      // Kiosk Success Screen & Timer
      const [latestBookingDetails, setLatestBookingDetails] = useState(null);
      const [countdown, setCountdown] = useState(10);

      const bookingsRef = useRef(bookings);
      
      // Load bookings & setup localStorage
      useEffect(() => {
        const storedBookings = localStorage.getItem('filkom_bookings');
        if (storedBookings) {
          const parsed = JSON.parse(storedBookings);
          setBookings(parsed);
          bookingsRef.current = parsed;
        } else {
          localStorage.setItem('filkom_bookings', JSON.stringify(INITIAL_BOOKINGS));
          setBookings(INITIAL_BOOKINGS);
          bookingsRef.current = INITIAL_BOOKINGS;
        }

        const storedNotifs = localStorage.getItem('filkom_notifications');
        if (storedNotifs) {
          setNotifications(JSON.parse(storedNotifs));
        } else {
          const initNotifs = [
            { id: 'n1', studentNim: '245150300111002', message: 'Selamat datang di portal scan Peminjaman FILKOM.', read: false, time: 'Baru saja' }
          ];
          localStorage.setItem('filkom_notifications', JSON.stringify(initNotifs));
          setNotifications(initNotifs);
        }
      }, []);

      // Keep ref updated and calculate facility states dynamically
      useEffect(() => {
        bookingsRef.current = bookings;
        setFacilities(prev => {
          return prev.map(fac => {
            const isActive = bookings.some(b => b.facilityId === fac.id && b.status === 'Aktif');
            return {
              ...fac,
              status: isActive ? 'digunakan' : 'tersedia'
            };
          });
        });
      }, [bookings]);

      // Storage sync interval (checks every 1 second)
      useEffect(() => {
        const syncInterval = setInterval(() => {
          const data = localStorage.getItem('filkom_bookings');
          if (data) {
            const parsed = JSON.parse(data);
            if (JSON.stringify(parsed) !== JSON.stringify(bookingsRef.current)) {
              setBookings(parsed);
            }
          }

          const notifData = localStorage.getItem('filkom_notifications');
          if (notifData) {
            setNotifications(JSON.parse(notifData));
          }
        }, 1000);

        return () => clearInterval(syncInterval);
      }, []);

      // Reset kiosk state back to scanner
      const handleResetKiosk = () => {
        setCurrentStudent(null);
        setSelectedFacilityId('');
        setBookingDuration('1');
        setBookingPurpose('');
        setBookingError('');
        setBookingSuccess('');
        setLatestBookingDetails(null);
        setCountdown(10);
      };

      // Countdown effect for kiosk success screen
      useEffect(() => {
        if (!latestBookingDetails) return;
        
        setCountdown(10);
        const interval = setInterval(() => {
          setCountdown(prev => {
            if (prev <= 1) {
              clearInterval(interval);
              handleResetKiosk();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(interval);
      }, [latestBookingDetails]);

      // Automatically open scanner on mount (if student is not logged in)
      useEffect(() => {
        if (!currentStudent) {
          startScanner();
        } else {
          stopScanner();
        }
        return () => {
          if (studentScannerRef.current) {
            studentScannerRef.current.stop().catch(e => {});
          }
        };
      }, [currentStudent]);

      // ==========================================
      // ACTION HANDLERS
      // ==========================================
      const startScanner = () => {
        if (studentScannerStateRef.current !== 'stopped') return;
        studentScannerStateRef.current = 'starting';
        setScannerActive(true);
        setScanFeedback({ text: '', type: '' });

        setTimeout(() => {
          try {
            const container = document.getElementById("student-webcam-container");
            if (!container) {
              studentScannerStateRef.current = 'stopped';
              return;
            }
            const scanner = new Html5Qrcode("student-webcam-container");
            studentScannerRef.current = scanner;
            
            scanner.start(
              { facingMode: "environment" },
              {
                fps: 15
              },
              (decodedText) => {
                handleScannedCode(decodedText);
              },
              (error) => {}
            ).then(() => {
              studentScannerStateRef.current = 'running';
              setStudentScanner(scanner);
            }).catch(err => {
              console.warn("Camera access failed. Simulation dropdown is ready.", err);
              studentScannerStateRef.current = 'stopped';
              studentScannerRef.current = null;
            });
          } catch (e) {
            console.error(e);
            studentScannerStateRef.current = 'stopped';
            studentScannerRef.current = null;
          }
        }, 300);
      };

      const stopScanner = () => {
        setScannerActive(false);
        const scanner = studentScannerRef.current;
        if (scanner) {
          const stopAction = () => {
            scanner.stop().then(() => {
              studentScannerRef.current = null;
              setStudentScanner(null);
              studentScannerStateRef.current = 'stopped';
            }).catch(err => {
              console.warn("Error stopping scanner:", err);
              studentScannerRef.current = null;
              setStudentScanner(null);
              studentScannerStateRef.current = 'stopped';
            });
          };

          if (studentScannerStateRef.current === 'starting') {
            let checks = 0;
            const interval = setInterval(() => {
              checks++;
              if (studentScannerStateRef.current === 'running') {
                clearInterval(interval);
                stopAction();
              } else if (studentScannerStateRef.current === 'stopped' || checks > 20) {
                clearInterval(interval);
              }
            }, 100);
          } else if (studentScannerStateRef.current === 'running') {
            stopAction();
          }
        }
      };

      // Handle decoding KTM-NIM to log in
      const handleScannedCode = (text) => {
        if (!text) return;
        setScanFeedback({ text: '', type: '' });

        let nim = text.trim();
        if (nim.startsWith('KTM-')) {
          nim = nim.substring(4);
        }

        const student = DUMMY_STUDENTS.find(s => s.nim === nim);
        if (student) {
          setCurrentStudent(student);
          setBookingError('');
          setBookingSuccess('');
          setScanFeedback({ text: `KTM ${student.name} berhasil terverifikasi!`, type: 'success' });
          stopScanner();
        } else {
          setScanFeedback({ text: `NIM KTM (${nim}) tidak dikenal dalam database.`, type: 'error' });
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setScanFeedback({ text: 'Memindai berkas gambar...', type: '' });

        const html5QrCode = new Html5Qrcode("file-qr-scanner-container");
        html5QrCode.scanFile(file, true)
          .then(decodedText => {
            handleScannedCode(decodedText);
            e.target.value = ''; // Reset file input so user can re-select same file if needed
          })
          .catch(err => {
            console.error("Gagal scan file:", err);
            setScanFeedback({ text: 'Gagal mendeteksi QR. Pastikan mengunggah gambar QR Code KTM yang jelas.', type: 'error' });
            e.target.value = ''; // Reset file input
          });
      };

      // Submit booking
      const handleCreateBooking = (e) => {
        e.preventDefault();
        setBookingError('');
        setBookingSuccess('');

        if (!selectedFacilityId || !bookingDuration || !bookingPurpose) {
          setBookingError('Harap lengkapi semua kolom peminjaman.');
          return;
        }

        const fac = facilities.find(f => f.id === selectedFacilityId);
        if (!fac) return;

        if (fac.status === 'digunakan') {
          setBookingError(`Fasilitas ${fac.name} sedang digunakan.`);
          return;
        }

        const now = new Date();
        const end = new Date(now.getTime() + parseFloat(bookingDuration) * 60 * 60 * 1000);
        
        const formatDate = (d) => {
          const pad = (n) => String(n).padStart(2, '0');
          return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };

        const tokenCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        let typePrefix = 'FC';
        if (fac.type === 'Ruangan') typePrefix = 'RM';
        if (fac.type === 'Fasilitas Olahraga') typePrefix = 'OL';
        const generatedToken = `QR-${typePrefix}-${tokenCode}`;

        const bookingStatus = 'Menunggu';

        const newBooking = {
          id: `b-${Date.now()}`,
          facilityId: fac.id,
          facilityName: fac.name,
          facilityType: fac.type,
          studentNim: currentStudent.nim,
          studentName: currentStudent.name,
          startTime: formatDate(now),
          endTime: formatDate(end),
          status: bookingStatus,
          token: generatedToken,
          reason: bookingPurpose
        };

        // Save to localStorage
        const latestBookings = [newBooking, ...bookingsRef.current];
        localStorage.setItem('filkom_bookings', JSON.stringify(latestBookings));
        setBookings(latestBookings);

        // Notify student
        const storedNotifs = JSON.parse(localStorage.getItem('filkom_notifications') || '[]');
        const newNotif = {
          id: `n-${Date.now()}`,
          studentNim: currentStudent.nim,
          message: `Permohonan peminjaman ${fac.name} diajukan! Menunggu persetujuan Admin.`,
          read: false,
          time: 'Baru saja'
        };
        const updatedNotifs = [newNotif, ...storedNotifs];
        localStorage.setItem('filkom_notifications', JSON.stringify(updatedNotifs));
        setNotifications(updatedNotifs);

        setBookingSuccess(`Permohonan peminjaman ${fac.name} berhasil dikirim ke Admin!`);

        setLatestBookingDetails(newBooking);
      };

      const handleLogout = () => {
        setCurrentStudent(null);
        setSelectedFacilityId('');
        setBookingDuration('1');
        setBookingPurpose('');
        setBookingError('');
        setBookingSuccess('');
        setLatestBookingDetails(null);
        setCountdown(10);
        setScanFeedback({ text: '', type: '' });
        setShowManualInput(false);
        setManualNim('');
      };

      // Filters
      const myActiveBooking = bookings.find(b => b.studentNim === (currentStudent ? currentStudent.nim : '') && b.status === 'Aktif');
      const myPendingBooking = bookings.find(b => b.studentNim === (currentStudent ? currentStudent.nim : '') && b.status === 'Menunggu');
      const myBookingsList = currentStudent ? bookings.filter(b => b.studentNim === currentStudent.nim) : [];

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans select-none antialiased">
          
          {/* Header - Only visible when student has logged in */}
          {currentStudent && (
            <header className="sticky top-0 z-40 bg-slate-900/90 border-b border-blue-500/30 text-white shadow-lg backdrop-blur-md">
              <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="bg-blue-600 text-slate-950 p-2 rounded-lg font-bold text-xs tracking-wider flex flex-col justify-center items-center h-10 w-10 shadow-md shadow-blue-500/20">
                    <span className="leading-none text-[10px]">UB</span>
                    <span className="font-extrabold text-[12px] leading-none">FKM</span>
                  </div>
                  <div>
                    <h1 className="font-extrabold text-sm sm:text-base tracking-wide text-blue-400">PEMINJAMAN FILKOM</h1>
                    <p className="text-[10px] text-slate-400">Peminjaman Fasilitas Mahasiswa</p>
                  </div>
                </div>

                <div className="flex items-center space-x-4">
                  <button 
                    onClick={handleLogout}
                    className="px-3.5 py-1.5 rounded-lg border border-slate-755 bg-slate-850 hover:bg-rose-955 hover:border-rose-900/40 text-slate-200 hover:text-white transition duration-200 text-xs font-extrabold"
                  >
                    Batal & Keluar
                  </button>
                </div>
              </div>
            </header>
          )}

          {/* Main Container */}
          <main className={`flex-grow flex flex-col items-center justify-center p-4 ${currentStudent ? 'w-full max-w-6xl mx-auto' : 'w-full max-w-md mx-auto'}`}>
            
            {/* STEP 1: AUTHENTICATION FLOW (SCAN QR ONLY VIEW) */}
            <div className={`w-full flex flex-col items-center justify-center space-y-6 ${!currentStudent ? '' : 'hidden'}`}>
              
              <div className="w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center relative overflow-hidden">
                {/* Glowing decorative background orb */}
                <div className="absolute -top-20 -left-20 w-40 h-40 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div className="absolute -bottom-20 -right-20 w-40 h-40 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <div className="bg-blue-600 text-slate-950 p-2.5 rounded-2xl font-black text-sm tracking-wider flex flex-col justify-center items-center h-12 w-12 shadow-lg shadow-blue-500/20 mb-4">
                  <span className="leading-none text-[10px] font-bold">UB</span>
                  <span className="font-extrabold text-[14px] leading-none">FKM</span>
                </div>

                <h2 className="text-lg font-extrabold text-white tracking-wide">PEMINJAMAN FILKOM KIOSK</h2>
                <p className="text-xs text-slate-400 mt-1 max-w-[280px]">
                  Silakan scan QR Code pada Kartu Tanda Mahasiswa (KTM) Anda untuk meminjam fasilitas.
                </p>

                {/* Scan Feedback */}
                {scanFeedback.text && (
                  <div className={`mt-4 w-full p-2.5 rounded-xl text-xs text-center border ${
                    scanFeedback.type === 'success' 
                      ? 'bg-emerald-950/70 border-emerald-900/40 text-emerald-300' 
                      : 'bg-rose-950/70 border-rose-900/40 text-rose-300'
                  }`}>
                    {scanFeedback.text}
                  </div>
                )}

                {/* Viewfinder Camera Area */}
                <div className="mt-5 relative w-72 h-72 rounded-2xl border-2 border-slate-800 bg-slate-950 overflow-hidden shadow-inner flex flex-col items-center justify-center">
                  
                  {/* Glowing camera viewfinder corners */}
                  <div className="absolute top-2 left-2 w-4 h-4 border-t-2 border-l-2 border-blue-500 z-30"></div>
                  <div className="absolute top-2 right-2 w-4 h-4 border-t-2 border-r-2 border-blue-500 z-30"></div>
                  <div className="absolute bottom-2 left-2 w-4 h-4 border-b-2 border-l-2 border-blue-500 z-30"></div>
                  <div className="absolute bottom-2 right-2 w-4 h-4 border-b-2 border-r-2 border-blue-500 z-30"></div>

                  <div id="student-webcam-container" className="absolute inset-0 w-full h-full object-cover"></div>
                  {/* Hidden container for file-upload QR decoding to avoid conflict with webcam scanner */}
                  <div id="file-qr-scanner-container" className="hidden"></div>
                  
                  {scannerActive && (
                    <div className="absolute inset-x-0 h-[2.5px] bg-blue-500 shadow-[0_0_12px_4px_#3B82F6] animate-scan-line z-20"></div>
                  )}

                  {!scannerActive && (
                    <div className="text-center p-4 z-10 space-y-3">
                      <div className="text-4xl text-slate-700 animate-pulse">📷</div>
                      <p className="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Menginisialisasi Kamera...</p>
                    </div>
                  )}
                </div>

                <div className="mt-4 flex items-center justify-center space-x-2 text-[10px] text-slate-400 font-mono">
                  <span className={`h-2 w-2 rounded-full ${scannerActive ? 'bg-blue-500 animate-ping' : 'bg-slate-600'}`}></span>
                  <span>{scannerActive ? 'KAMERA SCAN AKTIF' : 'MEMPERSIAPKAN SISTEM SCAN'}</span>
                </div>

                {scannerActive && (
                  <p className="mt-2 text-[9px] text-slate-500 max-w-[260px] leading-relaxed">
                    💡 **Tips**: Dekatkan QR code ke kamera atau redupkan kecerahan layar HP Anda jika terdapat pantulan cahaya (glare).
                  </p>
                )}

                {/* Alternatif Masuk / Fallbacks */}
                <div className="mt-5 w-full pt-4 border-t border-slate-800/80 space-y-3 text-center">
                  <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider">Alternatif Masuk</label>
                  
                  {!showManualInput ? (
                    <div className="flex items-center justify-center gap-2">
                      <label className="inline-block px-4 py-2 bg-slate-850 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-white rounded-xl text-[10px] font-extrabold cursor-pointer transition duration-200">
                        Upload File QR
                        <input 
                          type="file" 
                          accept="image/*" 
                          onChange={handleFileUpload} 
                          className="hidden" 
                        />
                      </label>
                      <button
                        type="button"
                        onClick={() => setShowManualInput(true)}
                        className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-slate-950 rounded-xl text-[10px] font-extrabold transition duration-200 shadow shadow-blue-500/10"
                      >
                        Ketik NIM Manual
                      </button>
                    </div>
                  ) : (
                    <div className="bg-slate-950/50 border border-slate-850 rounded-2xl p-3 text-left space-y-2.5 animate-in slide-in-from-bottom-2 duration-200">
                      <div className="flex justify-between items-center">
                        <label className="block text-[9px] font-bold text-slate-400 uppercase tracking-wider">Masukkan NIM Mahasiswa:</label>
                        <button 
                          type="button" 
                          onClick={() => { setShowManualInput(false); setManualNim(''); }}
                          className="text-[9px] font-bold text-rose-400 hover:text-rose-300 uppercase font-mono"
                        >
                          Batal
                        </button>
                      </div>
                      <div className="flex space-x-2">
                        <input 
                          type="text" 
                          value={manualNim}
                          onChange={(e) => setManualNim(e.target.value)}
                          placeholder="Contoh: 245150307111009"
                          className="flex-grow bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500"
                        />
                        <button 
                          type="button"
                          onClick={() => {
                            const student = DUMMY_STUDENTS.find(s => s.nim === manualNim.trim());
                            if (student) {
                              setCurrentStudent(student);
                              setBookingError('');
                              setBookingSuccess('');
                              setScanFeedback({ text: `KTM ${student.name} berhasil terverifikasi!`, type: 'success' });
                              stopScanner();
                              setShowManualInput(false);
                              setManualNim('');
                            } else {
                              alert("NIM KTM tidak dikenal dalam database.");
                            }
                          }}
                          className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-slate-950 rounded-xl text-xs font-extrabold transition duration-200"
                        >
                          Masuk
                        </button>
                      </div>
                    </div>
                  )}
                </div>


              </div>
            </div>

            {currentStudent && (
              latestBookingDetails ? (
                // ==========================================
                // STEP 3: KIOSK SUCCESS SCREEN
                // ==========================================
                <div className="w-full bg-slate-900 border border-blue-500/40 rounded-3xl p-8 shadow-2xl max-w-xl text-center space-y-6 animate-in zoom-in-95 duration-200 relative overflow-hidden">
                  <div className="absolute top-[-20%] left-[-20%] w-[60%] h-[60%] rounded-full bg-emerald-500/5 blur-[80px] pointer-events-none"></div>

                  <div className="mx-auto h-16 w-16 bg-emerald-950/60 border border-emerald-500/40 rounded-full flex items-center justify-center text-4xl text-emerald-400 shadow-lg shadow-emerald-500/10">
                    ✓
                  </div>
                  <div className="space-y-1">
                    <h2 className="text-xl font-black text-white">Pengajuan Berhasil Dikirim!</h2>
                    <p className="text-xs text-slate-400">Peminjaman Anda telah tercatat dan menunggu persetujuan admin.</p>
                  </div>

                  {/* Profile Summary Card */}
                  <div className="bg-slate-950/80 border border-slate-850 rounded-2xl p-4 flex items-center space-x-4 text-left">
                    <div className="w-14 h-16 bg-slate-900 rounded-lg flex items-center justify-center text-3xl border border-slate-800 overflow-hidden flex-shrink-0">
                      {currentStudent.photo.includes('/') || currentStudent.photo.includes('.') ? (
                        <img src={currentStudent.photo} alt={currentStudent.name} className="w-full h-full object-cover" />
                      ) : (
                        currentStudent.photo
                      )}
                    </div>
                    <div className="space-y-0.5">
                      <div className="text-[8px] text-slate-500 font-bold uppercase tracking-wider">MAHASISWA PEMOHON</div>
                      <div className="text-sm font-extrabold text-white leading-tight">{currentStudent.name}</div>
                      <div className="text-[10px] font-bold text-blue-400 font-mono">{currentStudent.nim}</div>
                      <div className="text-[10px] text-slate-400">{currentStudent.major} (Angkatan {currentStudent.angkatan})</div>
                    </div>
                  </div>

                  {/* Booking Details Summary */}
                  <div className="bg-slate-950/40 border border-slate-850 rounded-2xl p-4 text-left space-y-2.5">
                    <div className="flex justify-between items-center text-xs border-b border-slate-850/80 pb-1.5">
                      <span className="text-slate-500 font-bold uppercase text-[9px]">Fasilitas</span>
                      <span className="font-extrabold text-slate-200">{latestBookingDetails.facilityName}</span>
                    </div>
                    <div className="flex justify-between items-center text-xs border-b border-slate-850/80 pb-1.5">
                      <span className="text-slate-500 font-bold uppercase text-[9px]">Tujuan Sewa</span>
                      <span className="font-semibold text-slate-300">{latestBookingDetails.reason}</span>
                    </div>
                    <div className="flex justify-between items-center text-xs border-b border-slate-850/80 pb-1.5">
                      <span className="text-slate-500 font-bold uppercase text-[9px]">Durasi</span>
                      <span className="font-semibold text-slate-300">{bookingDuration} Jam</span>
                    </div>
                    <div className="flex justify-between items-center text-xs">
                      <span className="text-slate-500 font-bold uppercase text-[9px]">Status Persetujuan</span>
                      <span className="px-2.5 py-0.5 rounded text-[10px] font-extrabold bg-blue-950/80 text-blue-400 border border-blue-900/30 animate-pulse">
                        Menunggu ACC Admin
                      </span>
                    </div>
                  </div>

                  {/* Token Info */}
                  <div className="space-y-2 bg-slate-950 p-4 rounded-2xl border border-slate-850 flex flex-col items-center justify-center">
                    <div className="text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-2">QR Token Booking (Tunjukkan ke Admin jika diminta):</div>
                    <QRCodeSimulated token={latestBookingDetails.token} size={100} />
                    <div className="text-xs font-mono font-bold text-blue-500 mt-1">{latestBookingDetails.token}</div>
                  </div>

                  <div className="pt-2 space-y-3">
                    <button
                      onClick={handleResetKiosk}
                      className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-slate-950 text-xs font-extrabold rounded-xl shadow-lg transition duration-200"
                    >
                      Selesai & Scan KTM Lain
                    </button>
                    <p className="text-[10px] text-slate-500 italic">
                      Kios akan kembali ke halaman scan utama secara otomatis dalam <span className="text-blue-500 font-bold font-mono">{countdown}</span> detik.
                    </p>
                  </div>
                </div>
              ) : (
                // ==========================================
                // STEP 2: BOOKING FLOW (AFTER SCAN KTM)
                // ==========================================
                <div className="w-full space-y-6 animate-in fade-in duration-300">
                  
                  {/* Upper Section: Student Card Profile & Form */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    
                    {/* Student KTM Profile Card Display */}
                    <div className="md:col-span-1 flex flex-col justify-start space-y-3">
                      <span className="text-xs font-bold text-slate-400 uppercase tracking-wider pl-1">Identitas KTM Terverifikasi</span>
                      
                      <div className="bg-gradient-to-br from-indigo-950 via-slate-900 to-indigo-950 border border-slate-850 rounded-2xl p-5 shadow-2xl relative overflow-hidden">
                        {/* Gold banner line */}
                        <div className="absolute top-0 left-0 w-full h-1.5 bg-blue-600 shadow-md"></div>
                        
                        <div className="flex justify-between items-center border-b border-slate-850 pb-2 mb-4">
                          <span className="text-[8px] font-extrabold text-slate-400 tracking-wider">MAHASISWA FILKOM UB</span>
                          <span className="text-[8px] font-bold text-blue-400 bg-blue-950/40 border border-blue-900/30 px-2 py-0.5 rounded font-mono">ANGKATAN {currentStudent.angkatan}</span>
                        </div>

                        <div className="flex flex-col items-center space-y-4">
                          <div className="w-20 h-24 bg-slate-950 rounded-lg flex items-center justify-center border border-slate-800 shadow-inner overflow-hidden relative">
                            {currentStudent.photo.includes('/') || currentStudent.photo.includes('.') ? (
                              <img src={currentStudent.photo} alt={currentStudent.name} className="w-full h-full object-cover" />
                            ) : (
                              <span className="text-5xl">{currentStudent.photo}</span>
                            )}
                          </div>
                          
                          <div className="text-center space-y-1.5 w-full">
                            <h4 className="font-extrabold text-slate-100 text-sm leading-tight">{currentStudent.name}</h4>
                            <p className="text-xs font-bold text-blue-400 font-mono tracking-wider">{currentStudent.nim}</p>
                            <div className="border-t border-slate-850/80 my-2 pt-2 text-left space-y-1 text-[10px] text-slate-400">
                              <div className="flex justify-between">
                                <span className="text-slate-500 font-bold uppercase text-[8px]">Program Studi:</span>
                                <span className="font-semibold text-slate-300">{currentStudent.major}</span>
                              </div>
                              <div className="flex justify-between">
                                <span className="text-slate-500 font-bold uppercase text-[8px]">Fakultas:</span>
                                <span className="font-semibold text-slate-300">{currentStudent.faculty}</span>
                              </div>
                              <div className="flex justify-between">
                                <span className="text-slate-500 font-bold uppercase text-[8px]">Tgl Lahir:</span>
                                <span className="font-semibold text-slate-300">{currentStudent.dob}</span>
                              </div>
                              {currentStudent.phone && (
                                <div className="flex justify-between">
                                  <span className="text-slate-500 font-bold uppercase text-[8px]">No. Telepon:</span>
                                  <span className="font-semibold text-slate-300 font-mono">{currentStudent.phone}</span>
                                </div>
                              )}
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Booking Form Card */}
                    <div className="md:col-span-2 space-y-3">
                      <span className="text-xs font-bold text-slate-400 uppercase tracking-wider pl-1">Form Pengajuan Peminjaman</span>
                      
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-5">
                        
                        {bookingError && (
                          <div className="p-3 rounded-xl bg-rose-950/60 border border-rose-900/40 text-rose-300 text-xs flex items-center space-x-2">
                            <span className="flex-shrink-0">⚠️</span>
                            <span>{bookingError}</span>
                          </div>
                        )}

                        <form onSubmit={handleCreateBooking} className="space-y-5">
                          
                          {/* WHAT WOULD YOU LIKE TO BORROW SELECTION (VISUAL CARDS) */}
                          <div className="space-y-2">
                            <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Mau meminjam apa?</label>
                            
                            <div className="grid grid-cols-3 gap-3">
                              {facilities.map(f => {
                                const isSelected = selectedFacilityId === f.id;
                                const isOccupied = f.status === 'digunakan';
                                
                                // Choose icon and description based on name/type
                                let icon = '🏢';
                                let desc = 'Ruang Belajar/Rapat';
                                if (f.name.toLowerCase().includes('game')) {
                                  icon = '🎮';
                                  desc = 'PlayStation & PC Game';
                                } else if (f.name.toLowerCase().includes('basket')) {
                                  icon = '🏀';
                                  desc = 'Lapangan Olahraga';
                                }

                                return (
                                  <div
                                    key={f.id}
                                    onClick={() => {
                                      if (!isOccupied) {
                                        setSelectedFacilityId(f.id);
                                        setBookingPurpose('');
                                        setBookingError('');
                                        setBookingSuccess('');
                                      }
                                    }}
                                    className={`relative rounded-xl p-3 border text-left cursor-pointer transition duration-205 select-none flex flex-col justify-between ${
                                      isOccupied 
                                        ? 'opacity-40 cursor-not-allowed bg-slate-950 border-slate-900' 
                                        : isSelected
                                          ? 'border-blue-500 bg-blue-500/10 shadow-lg shadow-blue-500/5'
                                          : 'border-slate-800 bg-slate-950 hover:border-slate-700 hover:bg-slate-900/50'
                                    }`}
                                  >
                                    <div className="flex justify-between items-start">
                                      <span className="text-2xl">{icon}</span>
                                      <span className={`text-[8px] px-1.5 py-0.5 rounded font-black uppercase ${
                                        isOccupied ? 'bg-rose-950 text-rose-400' : 'bg-emerald-950 text-emerald-400'
                                      }`}>
                                        {isOccupied ? 'Penuh' : 'Tersedia'}
                                      </span>
                                    </div>
                                    <div className="mt-3">
                                      <h5 className="font-extrabold text-xs text-white leading-tight">{f.name}</h5>
                                      <p className="text-[9px] text-slate-500 mt-0.5 leading-none">{desc}</p>
                                    </div>
                                    
                                    {isSelected && (
                                      <div className="absolute -top-1.5 -right-1.5 h-4 w-4 bg-blue-600 rounded-full flex items-center justify-center text-[10px] text-slate-950 font-bold shadow-md">
                                        ✓
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          </div>

                          {/* DURATION & PURPOSE OF BOOKING */}
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                              <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Durasi Sewa:</label>
                              <select
                                value={bookingDuration}
                                onChange={(e) => setBookingDuration(e.target.value)}
                                className="w-full mt-1.5 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500"
                              >
                                <option value="0.5">30 Menit</option>
                                <option value="1">1 Jam</option>
                                <option value="2">2 Jam</option>
                                <option value="3">3 Jam</option>
                              </select>
                            </div>

                            <div>
                              <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Tujuan Peminjaman:</label>
                              <select
                                value={bookingPurpose}
                                onChange={(e) => setBookingPurpose(e.target.value)}
                                className="w-full mt-1.5 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500 disabled:opacity-40 disabled:cursor-not-allowed"
                                disabled={!selectedFacilityId}
                              >
                                <option value="">-- Pilih Tujuan --</option>
                                {selectedFacilityId && facilities.find(f => f.id === selectedFacilityId)?.type === 'Ruangan' ? (
                                  <>
                                    <option value="Rapat Kelompok">Rapat Kelompok</option>
                                    <option value="Kelas Pengganti">Kelas Pengganti</option>
                                    <option value="Kegiatan Himpunan">Kegiatan Himpunan</option>
                                    <option value="Lainnya">Lainnya</option>
                                  </>
                                ) : selectedFacilityId && facilities.find(f => f.id === selectedFacilityId)?.type === 'Game Corner' ? (
                                  <>
                                    <option value="Bermain Game (Rekreasi)">Bermain Game (Rekreasi)</option>
                                    <option value="Mini Turnamen">Mini Turnamen</option>
                                    <option value="Lainnya">Lainnya</option>
                                  </>
                                ) : selectedFacilityId && facilities.find(f => f.id === selectedFacilityId)?.type === 'Fasilitas Olahraga' ? (
                                  <>
                                    <option value="Latihan Basket">Latihan Basket</option>
                                    <option value="Kompetisi Olahraga">Kompetisi Olahraga</option>
                                    <option value="Lainnya">Lainnya</option>
                                  </>
                                ) : (
                                  <option value="" disabled>Pilih fasilitas dahulu</option>
                                )}
                              </select>
                            </div>
                          </div>

                          <div className="text-[10px] text-slate-400 bg-slate-950/50 p-3 rounded-xl border border-slate-850 flex items-start space-x-2">
                            <span className="text-xs">💡</span>
                            <p className="leading-normal">
                              **Informasi Penting**: Semua permohonan peminjaman unit (Game Corner, GKM Lantai 2, Lapangan Basket) wajib mendapatkan persetujuan (ACC) terlebih dahulu dari Administrator di Dashboard Admin.
                            </p>
                          </div>

                          <div className="flex justify-end space-x-3 pt-2">
                            <button
                              type="button"
                              onClick={handleLogout}
                              className="px-5 py-2.5 bg-slate-800 hover:bg-slate-755 text-slate-300 hover:text-white text-xs font-extrabold rounded-xl transition duration-200"
                            >
                              Batal
                            </button>
                            <button
                              type="submit"
                              className="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-slate-950 text-xs font-extrabold rounded-xl shadow shadow-blue-500/10 hover:shadow-lg transition duration-200"
                            >
                              Ajukan Peminjaman
                            </button>
                          </div>
                        </form>
                      </div>
                    </div>

                  </div>
                </div>
              )
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
